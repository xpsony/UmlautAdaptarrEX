version: 2
updates:
  # PRs open against `dev` (the active integration branch), not the default
  # branch `main`. Updates land where development happens and ride dev->main
  # on the next release — no back-merge from main into dev.
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    # Wait 3 days after a release before proposing it, so Dependabot never
    # opens a PR for a version that the pnpm minimumReleaseAge policy would
    # then reject in CI (ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION).
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    ignore:
      # better-sqlite3 has no direct importer — @prisma/adapter-better-sqlite3
      # is the only consumer and pins ^12.6.0. Bumping the root dependency to
      # 13.x therefore does not upgrade anything the app runs: pnpm keeps a 12.x
      # copy for the adapter and installs 13.x as a second, unused copy whose
      # implicit node-gyp step (13.x ships binding.gyp but dropped the
      # prebuild-install script) breaks the toolchain-free runtime-deps image
      # stage. Drop this ignore once the adapter's range includes 13.x.
      - dependency-name: "better-sqlite3"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "pnpm"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:15"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"

  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "docker"
